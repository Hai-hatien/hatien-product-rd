name: HT-PD-RD Clasp Access Diagnostic

on:
  push:
    branches:
      - backend/v1.3-hardening
    paths:
      - '.github/workflows/apps-script-clasp-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global '@google/clasp@3.4.0'
      - name: Load OAuth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}" || { echo 'MISSING_CLASPRC_JSON'; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json > /tmp/user.json
          node - <<'NODE'
          const x=require('/tmp/user.json');
          console.log('AUTHORIZED_USER='+(x.email||x.user?.email||x.authorizedUser?.email||'UNKNOWN'));
          NODE
      - name: Verify Apps Script API with one visible script
        run: |
          set -euo pipefail
          clasp list-scripts --json > /tmp/scripts.json
          node - <<'NODE' > /tmp/visible-id
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/scripts.json','utf8'));
          const arr=Array.isArray(raw)?raw:(raw.scripts||raw.projects||[]);
          console.log(String(arr[0]?.scriptId||arr[0]?.id||''));
          console.error('VISIBLE_SCRIPT_COUNT='+arr.length);
          for (const x of arr) {
            const title=String(x.title||x.name||'').replace(/[\r\n]/g,' ');
            if (title) console.error('VISIBLE_TITLE='+title);
          }
          NODE
          VISIBLE_ID="$(cat /tmp/visible-id)"
          test -n "$VISIBLE_ID" || { echo 'NO_VISIBLE_SCRIPTS'; exit 2; }
          mkdir -p /tmp/visible-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$VISIBLE_ID" > /tmp/visible-script/.clasp.json
          (cd /tmp/visible-script && clasp pull >/dev/null)
          echo 'CONTROL_PULL=PASS'
      - name: Verify exact target ownership
        run: |
          set -euo pipefail
          TARGET='1TGVEpC82jSws4y6lzl2vHSZ8Z8H0dkHhUFLY5_oPaSdCbY7e4knbqsfL'
          TARGET_DEPLOYMENT='AKfycbyfMvQKqkRD7NMHIE2S9Hy-8YdA02pwNLR70L62N11L3b4rdHM7yxBLzfWkTCtoO4Sy'
          rm -rf /tmp/target-script
          mkdir -p /tmp/target-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$TARGET" > /tmp/target-script/.clasp.json
          (cd /tmp/target-script && clasp pull >/dev/null)
          OUT="$(cd /tmp/target-script && clasp list-deployments 2>&1)"
          printf '%s\n' "$OUT" | grep -F "$TARGET_DEPLOYMENT"
          echo "EXACT_TARGET_SCRIPT_ID=$TARGET"
          echo 'TARGET_RESOLUTION=EXACT_DEPLOYMENT_OWNER_CONFIRMED'
      - name: Inspect target runtime file manifest and drift read-only
        run: |
          set -euo pipefail
          cd /tmp/target-script
          echo 'REMOTE_FILE_MANIFEST_BEGIN'
          find . -maxdepth 1 -type f ! -name '.clasp.json' -printf '%f\n' | sort
          echo 'REMOTE_FILE_MANIFEST_END'
          echo "REMOTE_GS_COUNT=$(find . -maxdepth 1 -type f -name '*.gs' | wc -l | tr -d ' ')"
          echo "REMOTE_HTML_COUNT=$(find . -maxdepth 1 -type f -name '*.html' | wc -l | tr -d ' ')"
          for f in Code.gs Index.html Client.html Styles.html appsscript.json; do
            if [ -f "$f" ]; then echo "REMOTE_HAS_${f//[^A-Za-z0-9]/_}=YES"; else echo "REMOTE_HAS_${f//[^A-Za-z0-9]/_}=NO"; fi
          done
          if grep -R -q --include='*.gs' 'runDailyRdOrchestrator' .; then echo 'REMOTE_LEGACY_ORCHESTRATOR=YES'; else echo 'REMOTE_LEGACY_ORCHESTRATOR=NO'; fi
          if grep -R -q --include='*.gs' 'OPENAI_API_KEY\|api.openai.com' .; then echo 'REMOTE_OPENAI_RUNTIME=YES'; else echo 'REMOTE_OPENAI_RUNTIME=NO'; fi
          if grep -R -q --include='*.gs' 'function doGet' .; then echo 'REMOTE_DOGET=YES'; else echo 'REMOTE_DOGET=NO'; fi
