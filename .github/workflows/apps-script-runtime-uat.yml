name: HT-PD-RD Apps Script Runtime UAT

on:
  push:
    branches:
      - backend/v1.3-hardening
    paths:
      - 'runtime/backend-uat-trigger.txt'
      - '.github/workflows/apps-script-runtime-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ht-pd-rd-runtime-uat
  cancel-in-progress: false

env:
  APPS_SCRIPT_ID: '1TGVEpC82jSws4y6lzl2vHSZ8Z8H0dkHhUFLY5_oPaSdCbY7e4knbqsfL'
  RUNTIME_GCP_PROJECT_ID: 'ha-tien-product-rd'
  RUNTIME_USER_KEY: 'runtime-uat'

jobs:
  runtime-uat:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned clasp
        run: npm install --global '@google/clasp@3.4.0'

      - name: Require dedicated Runtime Execution API credential
        env:
          CLASP_RUNTIME_JSON: ${{ secrets.CLASP_RUNTIME_JSON }}
        run: |
          set -euo pipefail
          test -n "${CLASP_RUNTIME_JSON:-}" || {
            echo 'Missing CLASP_RUNTIME_JSON. Runtime UAT requires OAuth created from the SAME standard Google Cloud project attached to the Apps Script project.'
            exit 1
          }
          printf '%s' "$CLASP_RUNTIME_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":".","projectId":"%s"}\n' "$APPS_SCRIPT_ID" "$RUNTIME_GCP_PROJECT_ID" > .clasp.json
          clasp --user "$RUNTIME_USER_KEY" show-authorized-user --json > /tmp/runtime-user.json
          node - <<'NODE'
          const x=require('/tmp/runtime-user.json');
          const email=x.email||x.user?.email||x.authorizedUser?.email||'UNKNOWN';
          if (email !== 'gpt@hatiencorp.vn') {
            console.error('RUNTIME_AUTH_USER_MISMATCH='+email);
            process.exit(1);
          }
          console.log('RUNTIME_AUTH_USER='+email);
          NODE
          echo 'RUNTIME_AUTH_PRECHECK=PASS'

      - name: Check whether Gemini migration secret is available without exposing it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo 'GITHUB_GEMINI_MIGRATION_SECRET=AVAILABLE'
          else
            echo 'GITHUB_GEMINI_MIGRATION_SECRET=NOT_AVAILABLE'
          fi

      - name: Execute runtime prerequisite verifier through Apps Script Execution API
        run: |
          set -euo pipefail
          set +e
          OUT="$(clasp --user "$RUNTIME_USER_KEY" run verifyRuntimePrerequisites --nondev 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT" | tee /tmp/runtime-prereq.txt

          if [ "$RC" -ne 0 ]; then
            echo "RUNTIME_PREREQ_EXECUTION=FAIL clasp_exit=$RC"
            exit "$RC"
          fi

          if printf '%s\n' "$OUT" | grep -Eqi 'Unable to run script function|permission to run the script function|NOT_AUTHORIZED|PERMISSION_DENIED|Exception:|Error:'; then
            echo 'RUNTIME_PREREQ_EXECUTION=FAIL api_error_detected'
            exit 1
          fi

          if ! printf '%s\n' "$OUT" | grep -Fq 'PREREQUISITES_VERIFIED'; then
            echo 'RUNTIME_PREREQ_EXECUTION=FAIL prerequisites_not_verified'
            exit 1
          fi

          echo 'RUNTIME_PREREQ_EXECUTION=PASS'
