name: HT-PD-RD Canonical UAT Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - backend/v1.3-hardening
    paths:
      - '.backend-uat-deploy-ready'

permissions:
  contents: read

concurrency:
  group: ht-pd-rd-canonical-uat
  cancel-in-progress: false

env:
  APPS_SCRIPT_ID: '1TGVEpC82jSws4y6lzl2vHSZ8Z8H0dkHhUFLY5_oPaSdCbY7e4knbqsfL'
  APPS_SCRIPT_DEPLOYMENT_ID: 'AKfycbyfMvQKqkRD7NMHIE2S9Hy-8YdA02pwNLR70L62N11L3b4rdHM7yxBLzfWkTCtoO4Sy'
  ROOT_DIR: 'apps-script/ht-pd-rd-v1'
  CANONICAL_REPOSITORY: 'Hai-hatien/hatien-product-rd'
  CANONICAL_BRANCH: 'backend/v1.3-hardening'

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce canonical source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$CANONICAL_BRANCH"
          if grep -R --line-number --fixed-strings 'Hai-hatien/hatien-digital-platform' "$ROOT_DIR"; then
            echo 'Legacy runtime source is forbidden.'
            exit 1
          fi
          test -f .backend-uat-deploy-ready

      - name: Validate runtime and UX package
        run: |
          set -euo pipefail
          for f in Config.gs CanonicalRuntime.gs Core.gs AuthService.gs RequestService.gs DecisionAuditService.gs WorkflowService.gs AuditIntegrityService.gs FlowScheduleService.gs MarketScoutService.gs RuntimeConfigService.gs UatBackendTestService.gs FlowWorkerService.gs AutomationService.gs DashboardService.gs Code.gs Index.html Client.html Styles.html appsscript.json; do
            test -f "$ROOT_DIR/$f" || { echo "Missing canonical file: $f"; exit 1; }
          done
          for handler in runR1Scheduled runR2Scheduled runR3Scheduled runR4Scheduled runR5Scheduled runR6Scheduled runR7Scheduled runR8Scheduled runR0DailySummary; do
            grep -R -q "function ${handler}" "$ROOT_DIR" || { echo "Missing runtime handler: $handler"; exit 1; }
          done
          grep -q 'Hôm nay cần quyết gì?' "$ROOT_DIR/Index.html"
          grep -q 'getBootstrapData' "$ROOT_DIR/DashboardService.gs"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned clasp
        run: npm install --global '@google/clasp@3.4.0'

      - name: Load deploy OAuth fail-closed
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}" || { echo 'Missing CLASPRC_JSON; no push.'; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Pull exact target and verify deployment ownership
        run: |
          set -euo pipefail
          rm -rf remote-script
          mkdir -p remote-script
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > remote-script/.clasp.json
          (cd remote-script && clasp pull >/tmp/target-pull.log)
          test -f remote-script/appsscript.json
          (cd remote-script && clasp list-deployments) | tee /tmp/target-deployments.log
          grep -F "$APPS_SCRIPT_DEPLOYMENT_ID" /tmp/target-deployments.log
          echo 'TARGET_OWNERSHIP_PRECHECK=PASS'

      - name: Build canonical Apps Script package
        run: |
          set -euo pipefail
          find remote-script -maxdepth 1 -type f -name '*.js' -delete
          for src in "$ROOT_DIR"/*.gs; do
            base="$(basename "${src%.gs}")"
            cp "$src" "remote-script/${base}.js"
          done
          cp "$ROOT_DIR/appsscript.json" remote-script/appsscript.json
          cp "$ROOT_DIR/Index.html" remote-script/Index.html
          cp "$ROOT_DIR/Client.html" remote-script/Client.html
          cp "$ROOT_DIR/Styles.html" remote-script/Styles.html
          test -f remote-script/Code.js
          test -f remote-script/DashboardService.js
          test -f remote-script/FlowWorkerService.js
          test -f remote-script/Index.html
          test -f remote-script/Client.html
          test -f remote-script/Styles.html
          if grep -R -q --include='*.js' 'OPENAI_API_KEY\|api.openai.com\|runDailyRdOrchestrator' remote-script; then
            echo 'Forbidden legacy runtime detected.'
            exit 1
          fi
          echo "CANONICAL_JS_COUNT=$(find remote-script -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
          echo "CANONICAL_HTML_COUNT=$(find remote-script -maxdepth 1 -type f -name '*.html' | wc -l | tr -d ' ')"

      - name: Push canonical source to exact Apps Script target
        working-directory: remote-script
        run: clasp push --force

      - name: Create immutable Apps Script version
        id: version
        working-directory: remote-script
        run: |
          set -euo pipefail
          OUT="$(clasp create-version "HT-PD-RD Gemini Worker V1 ${GITHUB_SHA}" 2>&1)"
          echo "$OUT"
          VERSION="$(printf '%s' "$OUT" | grep -Eo '[0-9]+' | tail -1)"
          test -n "$VERSION" || { echo 'Could not parse Apps Script version.'; exit 1; }
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update existing UAT Web App deployment
        working-directory: remote-script
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --versionNumber "${{ steps.version.outputs.number }}" \
            --description "HT-PD-RD Gemini Worker V1 ${GITHUB_SHA}"

      - name: Verify deployment coordinate
        working-directory: remote-script
        run: |
          set -euo pipefail
          clasp list-deployments | tee deployments.txt
          grep -F "$APPS_SCRIPT_DEPLOYMENT_ID" deployments.txt
          echo "CANONICAL_SOURCE_SHA=$GITHUB_SHA"
          echo "APPS_SCRIPT_VERSION=${{ steps.version.outputs.number }}"
          echo "WEB_APP=https://script.google.com/a/macros/hatiencorp.vn/s/${APPS_SCRIPT_DEPLOYMENT_ID}/exec"
          echo 'CANONICAL_MOBILE_UX_DEPLOYED=YES'
          echo 'GEMINI_FLOW_WORKER_V1_DEPLOYED=YES'
