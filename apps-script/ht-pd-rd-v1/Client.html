<script>
const LANGUAGE_DICTIONARY = {
  vi: { toggle: 'Tiếng Anh', toggleLabel: 'Đổi sang tiếng Anh', overview: 'Tổng quan', approvals: 'Cần quyết định', cases: 'Hồ sơ nghiên cứu', agents: 'Điều phối bộ xử lý', technical: 'Hệ thống', loading: 'Đang đọc dữ liệu mới nhất…', environment: 'Môi trường kiểm thử', noDecision: 'Không có việc cần quyết định.', noAccess: 'Không có quyền truy cập' },
  en: { toggle: 'Tiếng Việt', toggleLabel: 'Switch to Vietnamese', overview: 'Overview', approvals: 'Decisions', cases: 'Research files', agents: 'Automated operations', technical: 'System', loading: 'Reading the latest data…', environment: 'Test environment', noDecision: 'There is no decision needed.', noAccess: 'Access is not available' }
};
let languageMode = 'vi';
function t(key) { return (LANGUAGE_DICTIONARY[languageMode] && LANGUAGE_DICTIONARY[languageMode][key]) || key; }
function toggleLanguage() {
  languageMode = languageMode === 'vi' ? 'en' : 'vi';
  applyLanguage();
  if (appData) renderApp();
}
function applyLanguage() {
  const button = document.getElementById('languageToggle');
  if (button) { button.textContent = t('toggle'); button.setAttribute('aria-label', t('toggleLabel')); }
  document.documentElement.lang = languageMode;
}
function setMobileMenu(open) {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('mobileMenuOverlay');
  const toggle = document.getElementById('mobileMenuToggle');
  if (document.body) document.body.classList.toggle('mobile-menu-open', open);
  if (sidebar) sidebar.classList.toggle('is-open', open);
  if (overlay) { overlay.classList.toggle('is-open', open); if (overlay.setAttribute) overlay.setAttribute('aria-hidden', String(!open)); }
  if (toggle && toggle.setAttribute) { toggle.setAttribute('aria-expanded', String(open)); toggle.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu'); }
}
function toggleMobileMenu() { setMobileMenu(!document.body.classList.contains('mobile-menu-open')); }
function closeMobileMenu() { setMobileMenu(false); }
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMobileMenu(); });

let appData = null;
let activeLibraryTab = 'ALL';
let activeCaseTab = 'CASES';
let caseReturnState = null;
const articleApprovalState = Object.create(null);
let activeArticlePreview = null;
let activePreviewTab = 'display';

document.addEventListener('DOMContentLoaded', () => { applyLanguage(); reloadData(); });

function gas(method, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);
  });
}

async function reloadData() {
  setNotice(t('loading'));
  try {
    appData = await gas('getBootstrapData');
    renderApp();
    hideNotice();
  } catch (error) {
    showError(error);
  }
}

function renderApp() {
  const data = appData || {};
  if (data.restricted) {
    document.querySelector('.content').innerHTML = '<div class="notice error">' + esc(data.message || t('noAccess')) + '</div>';
    return;
  }

  const actor = data.actor || {};
  const environment = (data.project && data.project.environment) || 'PRODUCTION';
  const sidebarUser = document.getElementById('sidebarUser');
  if (sidebarUser) sidebarUser.textContent = actor.displayName || actor.email || 'Người dùng';
  const envBadge = document.getElementById('environmentBadge');
  if (envBadge) envBadge.textContent = languageMode === 'vi' ? t('environment') : environment;
  const techNav = document.getElementById('techNav');
  if (techNav) techNav.classList.toggle('hidden', !(actor.permissions && actor.permissions.technicalOperate));

  renderRuntime(data.runtime || {});
  renderKpis(data.kpis || {});
  renderDecisions(data.decisionCards || []);
  renderCases(data.cases || []);
  renderCandidates(data.candidateLibrary || []);
  renderPriorityProducts(data.productFamilies || []);
  renderTodayQueue(data.tasks || [], data.decisionCards || []);
  renderProductFamilyOptions(data.productFamilies || []);
  renderAgents(data.flowSchedule || [], data.agentAssignments || [], data.runtime || {});
  renderSystem(data);
}

function renderRuntime(runtime) {
  const ready = Boolean(runtime.triggerInstalled && runtime.aiConfigured);
  const badge = document.getElementById('runtimeBadge');
  if (badge) {
    badge.className = 'chip ' + (ready ? 'ok' : 'warn');
    badge.textContent = ready ? 'Worker đang hoạt động' : 'Cần kiểm tra Worker';
  }
  const banner = document.getElementById('runtimeBanner');
  if (banner) {
    banner.className = 'runtime-banner ' + (ready ? 'ready' : 'error');
    banner.innerHTML = `
      <div class="banner-icon">${ready ? '✓' : '!'}</div>
      <div><strong>${ready ? 'Worker Gemini và lịch R0–R8 đã kết nối' : 'Worker hoặc lịch R0–R8 chưa sẵn sàng'}</strong>
      <p>${ready ? esc((runtime.triggerCount || 0) + ' trigger • ' + (runtime.aiModel || 'Gemini') + ' • lần chạy: ' + (runtime.lastDailyRunStatus || 'đã ghi nhận')) : esc((runtime.missingFlows || []).join(', ') || 'Mở Hệ thống để xem chẩn đoán.')}</p></div>
      <button class="link-button" onclick="showViewByName('technical')">Xem hệ thống →</button>`;
  }
  const dot = document.getElementById('healthDot');
  if (dot) dot.className = 'status-dot ' + (ready ? 'ok' : 'warn');
  const health = document.getElementById('runtimeHealth');
  if (health) {
    health.innerHTML = [
      healthItem('Lịch R0–R8', runtime.triggerInstalled ? 'Đã cài ' + (runtime.triggerCount || 0) + ' trigger' : 'Thiếu trigger', runtime.triggerInstalled),
      healthItem('Gemini Worker', runtime.aiConfigured ? 'Đã kết nối • ' + (runtime.aiModel || '') : 'Chưa cấu hình', runtime.aiConfigured),
      healthItem('Lần chạy gần nhất', runtime.lastDailyRunStatus || 'CHƯA CÓ', Boolean(runtime.lastDailyRunAt)),
      healthItem('Product Master', 'READ ONLY', true)
    ].join('');
  }
  const summary = document.getElementById('runtimeSummary');
  if (summary) {
    summary.innerHTML = `<div class="runtime-grid">
      ${runtimeItem('Lịch điều phối', runtime.schedule || '—')}
      ${runtimeItem('Trigger R0–R8', runtime.triggerInstalled ? 'Đã cài (' + (runtime.triggerCount || 0) + ')' : 'Chưa đủ')}
      ${runtimeItem('Gemini', runtime.aiConfigured ? 'Đã cấu hình • ' + (runtime.aiModel || '') : 'Chưa cấu hình')}
      ${runtimeItem('Lần chạy gần nhất', runtime.lastDailyRunAt || 'CHƯA CÓ')}
    </div>`;
  }
}

function healthItem(label, value, ok) {
  return '<div class="health-item"><i class="' + (ok ? 'ok' : 'warn') + '"></i><div><strong>' + esc(label) + '</strong><small>' + esc(value) + '</small></div><b>' + (ok ? 'OK' : 'CHECK') + '</b></div>';
}

function runtimeItem(label, value) {
  return '<div class="runtime-item"><span>' + esc(label) + '</span><strong>' + esc(String(value || '—')) + '</strong></div>';
}

function renderKpis(kpis) {
  const cards = [
    ['Yêu cầu R&D', kpis.requestCount || 0, 'Tổng yêu cầu đã ghi nhận'],
    ['Cần Hải xem', kpis.openDecisionCount || 0, 'Quyết định đang mở'],
    ['Blocker P0/P1', kpis.blockerP0P1Count || 0, 'Việc đang chặn luồng'],
    ['Nhóm chủ lực', 4, 'Fryer • Tủ cơm • Chảo • Nồi']
  ];
  const el = document.getElementById('kpiCards');
  if (!el) return;
  el.innerHTML = cards.map((card, index) => `
    <article class="kpi-card ${index === 2 && Number(card[1]) > 0 ? 'alert' : ''}">
      <span>${esc(card[0])}</span><strong>${esc(String(card[1]))}</strong><small>${esc(card[2])}</small>
    </article>`).join('');
}

function renderDecisions(cards) {
  const top = cards.slice(0, 4);
  const overview = document.getElementById('overviewDecisions');
  const approvals = document.getElementById('approvalCards');
  const count = document.getElementById('decisionNavCount');
  if (count) count.textContent = String(cards.length || 0);
  if (overview) overview.innerHTML = top.length ? top.map(renderDecisionList).join('') : emptyState(t('noDecision'));
  if (approvals) approvals.innerHTML = cards.length ? cards.map(renderDecisionCard).join('') : emptyState(t('noDecision'));
}

function renderDecisionList(card) {
  return `<article class="item-card">
    <div><div class="item-meta"><span class="mini-tag warn">${esc(card.gateLabel || 'QUYẾT ĐỊNH')}</span><span class="mini-tag">${esc(statusLabel(card.status))}</span></div>
    <h4>${esc(card.title || card.id)}</h4><p>${esc(card.problem || card.subtitle || '')}</p></div>
    <button class="button secondary" onclick='openDecisionFromOverview(${JSON.stringify(card.id || card.decisionId || card.rdRequestId)})'>Xem</button>
  </article>`;
}

function renderDecisionCard(card) {
  const actions = renderDecisionActions(card);
  const missing = missingProposalFields(card);
  const source = firstValue(card.source, card.sourceRef, card.sourceUrl, card.evidenceSource);
  const evidenceDate = firstValue(card.evidenceDate, card.sourceDate, card.observedAt, card.createdAt);
  const confidence = firstValue(card.confidence, card.evidenceConfidence, card.reliability);
  const remaining = firstValue(card.missingEvidence, card.evidenceMissing, card.gaps);

  return `<article class="decision-card">
    <div class="decision-head"><div><span class="eyebrow">GÓI ĐỀ XUẤT QUYẾT ĐỊNH</span><h3>${esc(userText(card.title || card.id))}</h3><p>${esc(userText(card.subtitle || card.problem || ''))}</p></div><span class="badge warn">${esc(statusLabel(card.status))}</span></div>
    <div class="proposal-package">
      ${proposalSection('Đề xuất xử lý', firstValue(card.recommendation, card.proposal, card.action, card.decisionAction), 'Chưa đủ cơ sở duyệt')}
      ${proposalSection('Vì sao đáng làm', firstValue(card.reasons, card.whyNow, card.rationale, card.problem), 'Chưa đủ cơ sở duyệt')}
      ${proposalSection('Ai bị ảnh hưởng', firstValue(card.affectedGroups, card.customer, card.targetCustomer, card.context), 'Chưa đủ cơ sở duyệt')}
      ${proposalSection('Cơ hội cho Hà Tiên', firstValue(card.opportunities, card.haTienOpportunity, card.businessOpportunity), 'Chưa đủ cơ sở duyệt')}
      <div class="proposal-section"><h4>Bằng chứng đang có</h4><ul><li>Nguồn: ${esc(userText(source || 'Chưa đủ cơ sở duyệt'))}</li><li>Ngày: ${esc(userText(evidenceDate || 'Chưa đủ cơ sở duyệt'))}</li><li>Độ tin cậy: ${esc(userText(confidence || 'Chưa đủ cơ sở duyệt'))}</li><li>Phần còn thiếu: ${esc(userText(remaining || (missing.length ? missing.join(', ') : 'Chưa ghi nhận')))}</li></ul></div>
      <div class="proposal-section"><h4>Rủi ro cần chặn</h4><ul><li>Không diễn đạt Hà Tiên như đơn vị cấp chứng nhận pháp lý.</li><li>Không dùng nội dung pháp luật hoặc tiêu chuẩn khi chưa được kiểm chứng.</li><li>Không công bố nội dung nếu chưa qua rà soát.</li></ul></div>
      ${proposalSection('Việc cần anh Hải quyết', firstValue(card.decisionQuestion, card.ownerQuestion, card.question), 'Chưa đủ cơ sở duyệt')}
      ${proposalSection('Bước tiếp theo nếu đồng ý', firstValue(card.nextStep, card.nextSteps, card.followUp), 'Chưa đủ cơ sở duyệt')}
    </div>
    ${missing.length ? `<p class="proposal-missing">Chưa đủ cơ sở duyệt — cần bổ sung: ${esc(missing.join(', '))}</p>` : ''}
    <div class="form-actions">${actions}</div>
  </article>`;
}

function firstValue(...values) { return values.find(value => value != null && value !== '' && !(Array.isArray(value) && value.length === 0)); }
function asList(value) { return Array.isArray(value) ? value.filter(Boolean) : (value == null || value === '' ? [] : [value]); }
function proposalSection(title, value, emptyLabel) {
  const items = asList(value);
  return `<div class="proposal-section"><h4>${esc(title)}</h4>${items.length ? `<ul>${items.map(item => `<li>${esc(userText(item))}</li>`).join('')}</ul>` : `<p class="proposal-empty">${esc(emptyLabel)} — cần bổ sung dữ liệu.</p>`}</div>`;
}
function missingProposalFields(card) {
  const missing = [];
  if (!firstValue(card.recommendation, card.proposal, card.action, card.decisionAction)) missing.push('đề xuất xử lý');
  if (!firstValue(card.reasons, card.whyNow, card.rationale, card.problem)) missing.push('lý do đáng làm');
  if (!firstValue(card.affectedGroups, card.customer, card.targetCustomer, card.context)) missing.push('nhóm bị ảnh hưởng');
  if (!firstValue(card.opportunities, card.haTienOpportunity, card.businessOpportunity)) missing.push('cơ hội cho Hà Tiên');
  if (!firstValue(card.evidence, card.source, card.sourceRef, card.sourceUrl, card.evidenceSource)) missing.push('nguồn bằng chứng');
  if (!firstValue(card.decisionQuestion, card.ownerQuestion, card.question)) missing.push('câu hỏi cần anh Hải quyết');
  if (!firstValue(card.nextStep, card.nextSteps, card.followUp)) missing.push('bước tiếp theo');
  return missing;
}
function userText(value) {
  return String(value == null ? '' : value)
    .replace(/ACT_NOW_CONTINUE/g, 'TIẾP TỤC LÀM NGAY')
    .replace(/School Kitchen Readiness\/Audit/gi, 'Mức độ sẵn sàng và rà soát bếp ăn trường học')
    .replace(/\bdecision\b/gi, 'quyết định').replace(/\bevidence\b/gi, 'bằng chứng').replace(/\bpublic\b/gi, 'công bố')
    .replace(/\bAI\b/g, 'trí tuệ nhân tạo').replace(/\bchecklist\b/gi, 'danh sách kiểm tra').replace(/\baudit\b/gi, 'rà soát hiện trạng')
    .replace(/\breadiness\b/gi, 'mức độ sẵn sàng').replace(/\bworkflow\b/gi, 'quy trình').replace(/\bstatus\b/gi, 'trạng thái')
    .replace(/\btask\b/gi, 'việc cần làm').replace(/\bclaim\b/gi, 'nội dung cần kiểm chứng').replace(/\bgate\b/gi, 'điều kiện chặn')
    .replace(/\bbackend\b/gi, 'phần xử lý nền').replace(/\bfrontend\b/gi, 'phần giao diện');
}

function renderDecisionActions(card) {
  const permissions = (appData && appData.actor && appData.actor.permissions) || {};
  let actions = '';

  if (card.rdCaseId) {
    actions += "<button class=\"button secondary\" onclick='openRelatedCase(" + JSON.stringify(card.rdCaseId) + ")'>Mở hồ sơ</button>";
  } else if (card.rdRequestId) {
    actions += "<button class=\"button secondary\" onclick='openRequestDetail(" + JSON.stringify(card.rdRequestId) + ")'>Xem yêu cầu</button>";
  } else {
    actions += '<button class="button secondary" disabled>Chưa có hồ sơ liên kết</button>';
  }

  if (card.cardType === 'RESEARCH_REQUEST' && card.canApprove) {
    actions += "<button class=\"button primary\" onclick='approveResearchCard(" + JSON.stringify(card.rdRequestId) + ',' + JSON.stringify(card.id) + ")'>Duyệt nghiên cứu</button>";
  }

  if (card.cardType === 'OPEN_DECISION' && card.canApprove) {
    if (card.decisionType === 'RESEARCH_GATE' && card.rdRequestId) {
      actions += "<button class=\"button primary\" onclick='approveResearchOpenDecision(" + JSON.stringify(card.rdRequestId) + ")'>Duyệt nghiên cứu</button>";
    }
    if (card.decisionType === 'M0_INPUT_CONFIRMATION' && card.decisionId) {
      actions += "<button class=\"button primary\" onclick='confirmM0(" + JSON.stringify(card.decisionId) + ")'>Xác nhận M0</button>";
    }
    if (card.decisionType === 'WORK_PRIORITY_SELECTION' && permissions.setPriority && card.decisionId) {
      actions += `<select id="open-priority-${attr(card.id)}" class="priority-select"><option value="">Chọn P0-P3</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>`;
      actions += "<button class=\"button primary\" onclick='resolvePriorityDecision(" + JSON.stringify(card.decisionId) + ',' + JSON.stringify(card.id) + ")'>Xác nhận ưu tiên</button>";
    }
    if (card.decisionType === 'FAMILY_SCOPE_CONFIRMATION' && permissions.assignFamily && card.decisionId) {
      actions += "<button class=\"button primary\" onclick='resolveFamilyDecision(" + JSON.stringify(card.decisionId) + ")'>Xác nhận dòng sản phẩm</button>";
    }
  }

  return actions;
}

function fact(label, value) {
  return '<div class="fact"><span>' + esc(label) + '</span><strong>' + esc(String(value || '—')) + '</strong></div>';
}

function openDecisionFromOverview(decisionId) {
  const card = ((appData && appData.decisionCards) || []).find(row => String(row.id || row.decisionId || row.rdRequestId || '') === String(decisionId));
  if (!card) {
    showError(new Error('Không tìm thấy quyết định ' + decisionId + ' trong dữ liệu hiện tại.'));
    return;
  }
  showViewByName('approvals', { preserveScroll: true });
  renderDecisionDetail(card);
  scrollToDetailTop();
}

function renderDecisionDetail(card) {
  const box = document.getElementById('decisionDetail');
  if (!box) return;
  hideApprovalDetails('decisionDetail');
  box.classList.remove('hidden');
  box.innerHTML = `<div class="panel-heading"><div><span class="eyebrow">CHI TIẾT QUYẾT ĐỊNH • ${esc(card.decisionId || card.id || '')}</span><h3>${esc(card.title || card.id)}</h3><p>${esc(card.subtitle || card.gateLabel || '')}</p></div><button class="button secondary" onclick="closeDecisionDetail()">Đóng</button></div>
    <div class="decision-facts">
      ${fact('Trạng thái', statusLabel(card.status))}
      ${fact('Khách hàng', card.customer || 'CHƯA BIẾT')}
      ${fact('Pain / phạm vi', card.problem || 'CHƯA CÓ DỮ LIỆU')}
      ${fact('Bằng chứng', card.evidence || 'CHƯA CÓ')}
      ${fact('Khuyến nghị', card.recommendation || 'MỞ HỒ SƠ')}
      ${fact('Liên kết', card.rdCaseId || card.rdRequestId || 'CHƯA CÓ')}
    </div>
    <div class="form-actions">${renderDecisionActions(card)}</div>`;
}

function closeDecisionDetail() {
  const box = document.getElementById('decisionDetail');
  if (box) box.classList.add('hidden');
}

function openRequestDetail(requestId) {
  const request = ((appData && appData.requests) || []).find(row => String(row.RD_REQUEST_ID || '') === String(requestId));
  if (!request) {
    showError(new Error('Không tìm thấy yêu cầu ' + requestId + ' trong dữ liệu hiện tại.'));
    return;
  }
  const box = document.getElementById('requestDetail');
  if (!box) {
    showError(new Error('Thiếu vùng hiển thị chi tiết yêu cầu.'));
    return;
  }
  showViewByName('approvals', { preserveScroll: true });
  hideApprovalDetails('requestDetail');
  box.classList.remove('hidden');
  box.innerHTML = `<div class="panel-heading"><div><span class="eyebrow">CHI TIẾT YÊU CẦU • ${esc(request.RD_REQUEST_ID)}</span><h3>${esc(request.REQUEST_TITLE || request.RD_REQUEST_ID)}</h3><p>${esc(statusLabel(request.REQUEST_STATUS || ''))}</p></div><button class="button secondary" onclick="closeRequestDetail()">Đóng</button></div>
    <div class="decision-facts">
      ${fact('Dòng sản phẩm', request.TARGET_PRODUCT || 'CHƯA BIẾT')}
      ${fact('ID dòng nguồn', request.SOURCE_FAMILY_CONTAINER_ID || 'CHƯA MAP')}
      ${fact('Thị trường', request.TARGET_MARKET || 'CHƯA BIẾT')}
      ${fact('Khách hàng / use case', request.TARGET_CUSTOMER || 'CHƯA BIẾT')}
      ${fact('Pain', request.CUSTOMER_PAIN || 'CHƯA BIẾT')}
      ${fact('Mục tiêu', request.TARGET_OUTCOMES || 'CHƯA BIẾT')}
      ${fact('Ràng buộc', request.CONSTRAINTS || 'CHƯA BIẾT')}
      ${fact('Ưu tiên', request.WORK_PRIORITY || 'CHƯA CHỌN')}
      ${fact('Nguồn bằng chứng', request.SOURCE_URL_OR_FILE || 'CHƯA CÓ')}
    </div>`;
  scrollToDetailTop();
}

function closeRequestDetail() {
  const box = document.getElementById('requestDetail');
  if (box) box.classList.add('hidden');
}

function hideApprovalDetails(exceptId) {
  ['decisionDetail', 'requestDetail'].forEach(id => {
    const element = document.getElementById(id);
    if (element && id !== exceptId) element.classList.add('hidden');
  });
}

function scrollToDetailTop() {
  if (window.scrollTo) window.scrollTo({ top: 0, behavior: 'auto' });
}

async function approveResearchCard(requestId, cardId) {
  const reason = window.prompt('Ghi chú quyết định (có thể để trống):', '') || '';
  setNotice('Đang ghi quyết định…');
  try {
    const result = await gas('approveResearch', requestId, 'RESEARCH_APPROVED', reason);
    await reloadData();
    showResearchReceipt(result);
    setNotice('Đã duyệt nghiên cứu. Hồ sơ đã tạo, bấm “Mở hồ sơ” khi cần chuyển sang case.');
  } catch (error) { showError(error); }
}

async function approveResearchOpenDecision(requestId) {
  const reason = window.prompt('Lý do duyệt nghiên cứu:', 'Đủ điều kiện bắt đầu nghiên cứu') || '';
  setNotice('Đang duyệt nghiên cứu…');
  try {
    const result = await gas('approveResearch', requestId, 'RESEARCH_APPROVED', reason);
    await reloadData();
    showResearchReceipt(result);
    setNotice('Đã duyệt nghiên cứu. Hồ sơ đã tạo, bấm “Mở hồ sơ” khi cần chuyển sang case.');
  } catch (error) { showError(error); }
}

function showResearchReceipt(result) {
  showViewByName('approvals', { preserveScroll: true });
  hideApprovalDetails('decisionDetail');
  const box = document.getElementById('decisionDetail');
  if (!box) return;
  const caseId = result && result.caseId;
  box.classList.remove('hidden');
  box.innerHTML = `<div class="panel-heading"><div><span class="eyebrow">BIÊN NHẬN • ${esc((result && result.decisionId) || '')}</span><h3>Đã duyệt nghiên cứu</h3><p>Hệ thống giữ nguyên ngữ cảnh. Chỉ mở hồ sơ khi người dùng chọn bước tiếp theo.</p></div><button class="button secondary" onclick="closeDecisionDetail()">Đóng</button></div>
    <div class="decision-facts">
      ${fact('Yêu cầu', (result && result.requestId) || '—')}
      ${fact('Hồ sơ', caseId || 'CHƯA TẠO')}
      ${fact('Quyết định', statusLabel((result && result.decision) || 'RESEARCH_APPROVED'))}
      ${fact('Bước tiếp theo', 'Mở hồ sơ để xem M0/R1/R2/R3')}
    </div>
    <div class="form-actions">${caseId ? "<button class=\"button primary\" onclick='openRelatedCase(" + JSON.stringify(caseId) + ")'>Mở hồ sơ</button>" : ''}</div>`;

async function loadCase(caseId) {
  setNotice('Đang tải hồ sơ…');
  try {
    if (!caseReturnState) {
      const currentView = document.querySelector('.view.active');
      caseReturnState = {
        view: currentView && currentView.id ? currentView.id.replace(/^view-/, '') : 'cases',
        tab: activeCaseTab,
        scrollY: window.scrollY || 0
      };
    }
    const detail = await gas('getCaseDetail', caseId);
    const box = document.getElementById('caseDetail');
    showViewByName('cases', { preserveScroll: true });
    box.classList.remove('hidden');
    box.innerHTML = `<div class="panel-heading"><div><span class="eyebrow">CHI TIẾT HỒ SƠ • ${esc(caseId)}</span><h3>${esc(detail.caseRecord.CASE_TITLE || caseId)}</h3></div><button class="button secondary" onclick="closeCaseDetail()">Quay lại</button></div>

function closeCaseDetail() {

function articleState(id) { return articleApprovalState[String(id)] || (articleApprovalState[String(id)] = { proposalApproved: false, contentApproved: false, previewOpened: false, htmlConfirmed: false }); }

function setPreviewTab(tab, button) { activePreviewTab = tab; document.querySelectorAll('[data-preview-tab]').forEach(item => item.classList.toggle('active', item.dataset.previewTab === tab)); if (button) button.classList.add('active'); renderArticlePreview(); }
function renderArticlePreview() { const card = articleCard(activeArticlePreview); const fragment = articleFragment(card); const payload = { title: userText(card.title || ''), status: 'draft', content: fragment, contentType: 'html-fragment', standard: 'HATIENCORP_WEB_ARTICLE_STANDARD_v2.1' }; const display = document.getElementById('previewDisplay'); const fragmentEl = document.getElementById('previewFragment'); const webData = document.getElementById('previewWebData'); const contract = document.getElementById('previewContract'); if (display) display.innerHTML = fragment; if (fragmentEl) fragmentEl.textContent = fragment; if (webData) webData.textContent = JSON.stringify(payload, null, 2); if (contract) contract.innerHTML = '<p>Đạt: chỉ có mảnh nội dung, trạng thái bản nháp và đúng chuẩn hiển thị.</p><p>Chưa gửi: chưa có xác nhận của anh Hải.</p>'; const panels = { display, fragment: fragmentEl, webData, contract }; Object.entries(panels).forEach(([name, item]) => { if (item) item.classList.toggle('hidden', name !== activePreviewTab); }); const state = articleState(activeArticlePreview); const confirm = document.getElementById('htmlPreviewConfirm'); const send = document.getElementById('sendArticleDraft'); if (confirm) confirm.checked = state.htmlConfirmed; if (send) send.disabled = !(state.proposalApproved && state.contentApproved && state.previewOpened && state.htmlConfirmed); }

    const id = run.RUN_ID || run.FLOW_RUN_ID || run.FLOW_ID || 'RUN';
    const status = run.RUN_STATUS || run.STATUS || 'RECORDED';
    const time = run.FINISHED_AT || run.STARTED_AT || '';
    return '<div class="run-row"><div><strong>' + esc(id) + '</strong><span>' + esc(normalizeTime(time)) + '</span></div><span class="badge ' + (/READY|PASS|COMPLETE|VERIFIED/.test(String(status)) ? 'ok' : '') + '">' + esc(statusLabel(status)) + '</span></div>';
  }).join('') + '</div>' : emptyState('Chưa có log chạy.');
}

function openCreateRequest() {
  const modal = document.getElementById('createModal');
  if (modal) modal.classList.remove('hidden');
  setRequestStep(1);
  if (document.body) document.body.style.overflow = 'hidden';
}

function closeCreateRequest() {
  const modal = document.getElementById('createModal');
  if (modal) modal.classList.add('hidden');
  if (document.body) document.body.style.overflow = '';
}

function setRequestStep(step) {
  document.querySelectorAll('.request-step').forEach(el => el.classList.toggle('hidden', Number(el.dataset.step) !== Number(step)));
  const badge = document.getElementById('requestStepBadge');
  const progress = document.getElementById('stepProgress');
  if (badge) badge.textContent = 'BƯỚC ' + step + '/2';
  if (progress) progress.style.width = (step * 50) + '%';
}

async function submitRequest(event) {
  event.preventDefault();
  const form = event.target;
  const payload = Object.fromEntries(new FormData(form).entries());
  const extra = [
    payload.sizeLimit && 'Kích thước: ' + payload.sizeLimit,
    payload.energySource && 'Năng lượng: ' + payload.energySource,
    payload.targetBudget && 'Ngân sách: ' + payload.targetBudget
  ].filter(Boolean).join(' | ');
  payload.constraints = [payload.constraints, extra].filter(Boolean).join(' | ') || 'CHƯA BIẾT';
  setNotice('Đang tạo yêu cầu R&D…');
  try {
    const result = await gas('createRdRequest', payload);
    form.reset();
    closeCreateRequest();
    await reloadData();
    openRequestDetail(result.requestId);
    setNotice('Đã tạo ' + result.requestId + '.');
  } catch (error) { showError(error); }
}

async function verifyRuntime() {
  const output = document.getElementById('technicalOutput');
  if (output) output.textContent = 'Đang kiểm tra…';
  try {
    const result = await gas('verifyRuntimePrerequisites');
    if (output) output.textContent = JSON.stringify(result, null, 2);
    await reloadData();
    showViewByName('technical');
  } catch (error) {
    if (output) output.textContent = error.message || String(error);
  }
}

async function runBehavioralUat() {
  const output = document.getElementById('technicalOutput');
  if (output) output.textContent = 'Đang chạy backend UAT…';
  try {
    if (output) output.textContent = JSON.stringify(await gas('runBackendUatGateTests'), null, 2);
    await reloadData();
  } catch (error) {
    if (output) output.textContent = error.message || String(error);
  }
}

function showView(name, button) {
  closeMobileMenu();
  const current = document.querySelector('.view.active');
  const alreadyActive = current && current.id === 'view-' + name;
  document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.id === 'view-' + name));
  document.querySelectorAll('[data-view]').forEach(nav => nav.classList.toggle('active', nav.dataset.view === name));
  if (button) button.classList.add('active');
  const title = document.getElementById('screenTitle');
  const titles = { overview: t('overview'), approvals: t('approvals'), cases: t('cases'), agents: t('agents'), technical: t('technical') };
  if (title) title.textContent = titles[name] || 'Command Center';
  const opts = arguments[2] || {};
  if (!opts.preserveScroll && !alreadyActive) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showViewByName(name, opts) { showView(name, null, opts || {}); }
function setNotice(message) { const el = document.getElementById('notice'); if (el) { el.textContent = message; el.className = 'notice'; } }
function hideNotice() { const el = document.getElementById('notice'); if (el) el.className = 'notice hidden'; }
function showError(error) { const el = document.getElementById('notice'); if (el) { el.textContent = (error && error.message) || String(error); el.className = 'notice error'; } }
function emptyState(text) { return '<div class="empty-state">' + esc(text) + '</div>'; }
function statusLabel(value) {
  const raw = String(value || '—');
  const labels = {
    REQUESTED: 'Chờ duyệt', READY: 'Sẵn sàng', READY_MONITORING: 'Đang theo dõi',
    WAITING_AUTHORIZED_APPROVAL: 'Chờ người có quyền duyệt', WAITING_INPUT: 'Chờ đầu vào',
    WAITING_DEPENDENCY: 'Chờ phụ thuộc', BLOCKED: 'Bị chặn', HANDOFF_READY: 'Sẵn sàng bàn giao',
    PREREQUISITES_VERIFIED: 'Điều kiện đã xác minh', INSTALLED: 'Đã cài'
  };
  return labels[raw] || userText(raw.replace(/_/g, ' '));
}
function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function attr(value) { return String(value == null ? '' : value).replace(/[^a-zA-Z0-9_-]/g, '-'); }
</script>
