<style>
:root{
  --bg:#f4f2ee;--panel:#fff;--text:#202427;--muted:#666c70;--line:#dedbd5;
  --accent:#c29a62;--accent-2:#d6aa6d;--accent-soft:#f4eadc;--danger:#a93434;--danger-soft:#fce7e7;
  --ok:#356b4b;--ok-soft:#e9f4ed;--shadow:0 8px 30px rgba(31,35,38,.08);--radius:14px;
}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,h4,p{margin-top:0}h1{font-size:24px;margin-bottom:2px}h2{font-size:34px;line-height:1.15;margin-bottom:8px}h3{font-size:21px;margin-bottom:8px}h4{font-size:17px;margin-bottom:4px}p{color:var(--muted);margin-bottom:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand-kicker,.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;color:#8a6a3f}.header-actions{display:flex;align-items:center;gap:10px}.badge{display:inline-flex;align-items:center;min-height:32px;padding:5px 10px;border-radius:999px;background:#eeeae4;color:#555;font-size:13px;font-weight:800}.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:#f7eddc;color:#855d24}.badge.muted{background:#eeeae4}
.app-shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 83px)}.sidebar{position:sticky;top:83px;height:calc(100vh - 83px);background:#2c2f31;padding:18px 12px;display:flex;flex-direction:column;gap:7px}.nav-item{border:0;background:transparent;color:#d6d6d3;padding:12px 14px;border-radius:11px;text-align:left;display:flex;gap:11px;align-items:center;font-weight:700}.nav-item:hover,.nav-item.active{background:#3a3d3f;color:#fff}.content{width:min(1180px,100%);padding:26px;margin:0 auto 80px}.view{display:none}.view.active{display:block}.hidden{display:none!important}
.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding:28px;background:linear-gradient(135deg,#fff,#f6efe4);border:1px solid #e4d5c1;border-radius:18px;box-shadow:var(--shadow);margin-bottom:18px}.hero p{max-width:650px}.button{border:1px solid var(--accent);background:var(--accent);color:#202427;font-weight:800;padding:10px 15px;min-height:44px;border-radius:11px}.button:hover{filter:brightness(.98)}.button.secondary{background:#fff;color:var(--text);border-color:#cbc6bd}.button.primary{padding:12px 18px}.button.compact{min-height:38px;padding:7px 12px}.link-button{border:0;background:transparent;color:#7b5a2e;font-weight:800;padding:8px}.link-button:hover{text-decoration:underline}
.notice{position:sticky;top:92px;z-index:25;padding:12px 14px;margin-bottom:14px;border-radius:10px;background:#ece8e1;border:1px solid #dad4ca}.notice.error{background:var(--danger-soft);color:var(--danger);border-color:#efc1c1}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 3px 14px rgba(31,35,38,.04)}.kpi-card span{display:block;color:var(--muted);font-weight:700;font-size:14px}.kpi-card strong{display:block;font-size:31px;line-height:1.15;margin:8px 0}.kpi-card small{color:var(--muted)}.kpi-card.alert{border-color:#e3b7b7;background:#fffafa}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 4px 18px rgba(31,35,38,.04);margin-bottom:16px}.panel-heading,.section-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:16px}.section-heading{margin:4px 0 18px}.section-heading h2{margin-bottom:6px}.card-list,.candidate-list,.decision-grid{display:grid;gap:12px}.item-card,.candidate-card,.decision-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.item-card,.candidate-card{display:flex;justify-content:space-between;gap:16px;align-items:center}.item-card p,.candidate-card p{font-size:14px}.candidate-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.candidate-meta span{font-size:12px;font-weight:800;background:var(--accent-soft);padding:4px 8px;border-radius:999px}.candidate-line{font-size:14px;margin-top:5px;color:#4b5053}.candidate-line b{color:var(--text)}.decision-card{padding:20px}.decision-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.decision-facts,.case-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.fact{border:1px solid #e2dfda;background:#faf9f7;border-radius:10px;padding:12px}.fact span{display:block;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.fact strong{font-size:14px}.priority-select{min-height:44px;border:1px solid #cfc9bf;border-radius:10px;padding:8px 10px;background:#fff}.summary-lines{display:grid;gap:8px;color:#454a4d}.empty-state{border:1px dashed #ccc5bb;border-radius:12px;padding:20px;text-align:center;color:var(--muted);background:#faf9f6}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.span-2{grid-column:1/-1}.request-step{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.request-step h3{grid-column:1/-1}.form-grid label,.request-step label{display:grid;gap:6px;font-weight:750;color:#363a3d}.form-grid input,.form-grid select,.form-grid textarea,.request-step input,.request-step select,.request-step textarea{width:100%;border:1px solid #cfcac1;border-radius:10px;background:#fff;color:var(--text);padding:11px 12px;min-height:44px;outline:none}.form-grid textarea,.request-step textarea{resize:vertical}.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus,.request-step input:focus,.request-step select:focus,.request-step textarea:focus{border-color:#a9824e;box-shadow:0 0 0 3px rgba(194,154,98,.15)}.form-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.step-badge{background:var(--accent-soft);color:#76552b;font-weight:800;padding:7px 10px;border-radius:999px;white-space:nowrap}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.tab{border:1px solid #cfc9bf;background:#fff;padding:9px 12px;border-radius:999px;white-space:nowrap;font-weight:750}.tab.active{background:#2d3032;color:#fff;border-color:#2d3032}.runtime-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.runtime-item{background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:12px}.runtime-item span{display:block;color:var(--muted);font-size:13px}.runtime-item strong{display:block;margin-top:4px}pre{white-space:pre-wrap;word-break:break-word;background:#25282a;color:#f3f1eb;border-radius:12px;padding:14px;max-height:480px;overflow:auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{border-bottom:1px solid #e4e0da;text-align:left;padding:10px 9px;font-size:14px}th{background:#f3f0ea;color:#454a4d}
.mobile-nav{display:none}
@media(max-width:900px){.app-shell{grid-template-columns:1fr}.sidebar{display:none}.content{padding:16px 14px 92px}.topbar{padding:12px 14px;top:0}.topbar h1{font-size:18px}.brand-kicker{font-size:10px}.header-actions .compact{display:none}.hero{padding:19px;align-items:stretch;flex-direction:column}.hero h2{font-size:29px}.hero .button{width:100%}.kpi-grid{grid-template-columns:repeat(2,1fr)}.kpi-card{padding:14px}.kpi-card strong{font-size:26px}.panel{padding:16px}.panel-heading,.section-heading{align-items:flex-start}.item-card,.candidate-card{align-items:flex-start;flex-direction:column}.item-card .button,.candidate-card .button{width:100%}.decision-facts,.case-stats,.runtime-grid{grid-template-columns:1fr}.form-grid,.request-step{grid-template-columns:1fr}.span-2{grid-column:auto}.request-step h3{grid-column:auto}.sticky-action{position:sticky;bottom:70px;background:#fff;padding:10px 0 2px;z-index:5}.form-actions .button{flex:1}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));box-shadow:0 -8px 30px rgba(31,35,38,.08)}.mobile-nav button{border:0;background:transparent;color:#6c7072;min-height:52px;border-radius:10px;font-weight:750;display:grid;place-items:center;gap:1px}.mobile-nav button span{font-size:11px}.mobile-nav button.active{background:#f3eadc;color:#76552b}.decision-head{flex-direction:column}.decision-head .badge{align-self:flex-start}}
@media(max-width:430px){body{font-size:15px}.content{padding-left:10px;padding-right:10px}.topbar{gap:8px}.header-actions{gap:5px}.badge{font-size:11px;padding:4px 7px}.hero h2{font-size:26px}.kpi-grid{gap:8px}.kpi-card span{font-size:12px}.kpi-card strong{font-size:24px}.panel{border-radius:12px}.section-heading h2{font-size:28px}}
</style>
