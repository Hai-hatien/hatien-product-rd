<style>
:root{
  --ink:#1f2422;--ink-2:#2b312e;--paper:#f4f3ef;--panel:#fff;--soft:#f8f7f3;
  --text:#242825;--muted:#6c716d;--line:#dddcd5;--line-dark:#c8c6bd;
  --gold:#c99745;--gold-soft:#f7ecd8;--green:#176b4a;--green-soft:#e7f2ec;
  --red:#9b3027;--red-soft:#faeae6;--amber:#976018;--amber-soft:#fff2d8;
  --shadow:0 8px 28px rgba(30,34,31,.07);--radius:10px;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--paper);color:var(--text);font:500 16px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin-top:0}
h1{font:600 24px/1.15 Georgia,"Times New Roman",serif;margin:3px 0 0}
h2{font:500 34px/1.15 Georgia,"Times New Roman",serif;margin:4px 0 7px}
h3{font:650 18px/1.25 Georgia,"Times New Roman",serif;margin:3px 0 5px}
h4{font-size:16px;margin:0 0 3px}
p{color:var(--muted);margin-bottom:0}
.hidden{display:none!important}

.app-shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--ink);color:#fff;padding:18px 14px 16px;display:flex;flex-direction:column;border-right:1px solid #363c38}
.brand{height:59px;padding:0 5px 15px;border-bottom:1px solid #3a3f3c}
.brand img{display:block;max-width:160px;max-height:34px;object-fit:contain;object-position:left center}
.brand-subtitle{font-size:16px;letter-spacing:.19em;color:#d6b878;margin:6px 0 0 50px}
.scope-card{margin:15px 4px 13px;padding:12px;border:1px solid #434a46;background:#292e2b}
.scope-card span{display:block;font-size:16px;letter-spacing:.14em;color:#b5b9b6}
.scope-card strong{display:block;font:600 16px/1.3 Georgia,serif;margin:4px 0;color:#f5f1e8}
.scope-card small{color:#d2b575;font-size:16px}
.main-nav{display:grid;gap:4px}
.nav-item{position:relative;width:100%;border:0;background:transparent;color:#cfd3d0;min-height:42px;padding:9px 10px;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;text-align:left;border-radius:5px}
.nav-item i{font-style:normal;font-size:17px;color:#aeb4b0;text-align:center}
.nav-item span{font-weight:650;font-size:16px}
.nav-item b{min-width:20px;padding:2px 6px;border-radius:999px;background:#4b3a24;color:#f3cf91;font-size:16px;text-align:center}
.nav-item:hover{background:#2d3430;color:#fff}
.nav-item.active{background:#f7f4ed;color:#222824}
.nav-item.active i{color:var(--gold)}
.nav-item.active b{background:var(--gold-soft);color:#7d5520}
.sidebar-user{margin-top:auto;padding:15px 7px 2px;border-top:1px solid #3a3f3c;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;display:grid;place-items:center;background:#303733;border:1px solid #59615c;color:#edc883;font:600 16px Georgia,serif}
.sidebar-user strong,.sidebar-user small{display:block}
.sidebar-user strong{font-size:16px}.sidebar-user small{font-size:16px;color:#9ea49f}

.workspace{min-width:0}
.topbar{position:sticky;top:0;z-index:30;min-height:78px;background:rgba(255,255,253,.97);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;gap:18px;align-items:center}
.top-kicker,.eyebrow{font-size:16px;font-weight:800;letter-spacing:.16em;color:#8f6630}
.header-actions{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border:1px solid #dbc69e;background:#fff9ed;color:#7d5a25;border-radius:999px;font-size:16px;font-weight:800;letter-spacing:.04em}
.chip.ok{border-color:#b9d8c8;background:var(--green-soft);color:var(--green)}
.chip.warn{border-color:#efd1a1;background:var(--amber-soft);color:var(--amber)}
.chip.muted{border-color:var(--line);background:#f0efeb;color:#666b67}
.icon-button{width:34px;height:34px;border:1px solid var(--line);background:#fff;color:#555;border-radius:6px;font-size:18px}
.button{border:1px solid var(--gold);background:var(--gold);color:#222;font-weight:750;padding:9px 13px;min-height:38px;border-radius:5px}
.button:hover{filter:brightness(.98);box-shadow:0 3px 10px rgba(80,60,30,.08)}
.button.secondary{background:#fff;border-color:var(--line-dark);color:var(--text)}
.button.primary{background:var(--green);border-color:var(--green);color:#fff}
.button:disabled{opacity:.5;cursor:not-allowed}
.link-button{border:0;background:transparent;color:#8a622d;font-size:16px;font-weight:750;padding:6px;white-space:nowrap}
.link-button:hover{text-decoration:underline}

.content{width:min(1370px,100%);margin:0 auto;padding:22px 26px 70px}
.view{display:none}.view.active{display:block}
.notice{position:fixed;top:88px;right:26px;z-index:90;width:min(420px,calc(100vw - 52px));padding:10px 13px;border-left:3px solid var(--gold);background:#fff7e8;color:#745326;box-shadow:var(--shadow)}
.notice.error{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.runtime-banner{min-height:58px;margin-bottom:19px;padding:10px 14px;border:1px solid #e3bd78;border-left:4px solid var(--gold);background:#fff4df;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.runtime-banner.ready{border-color:#a9cfba;border-left-color:var(--green);background:#eff8f3}
.runtime-banner.error{border-color:#e2b4ad;border-left-color:var(--red);background:var(--red-soft)}
.banner-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#f1d49b;color:#80551b;font-weight:900}
.runtime-banner.ready .banner-icon{background:#cbe5d6;color:var(--green)}
.runtime-banner strong{font-size:16px}.runtime-banner p{font-size:16px}
.page-heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin:3px 0 17px}
.page-heading p{max-width:700px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}
.kpi-card{position:relative;background:#fff;border:1px solid var(--line);border-top:3px solid #7a817c;padding:14px 16px;min-height:102px}
.kpi-card:nth-child(2){border-top-color:var(--gold)}
.kpi-card:nth-child(3){border-top-color:#a4473d}
.kpi-card:nth-child(4){border-top-color:var(--green)}
.kpi-card span{display:block;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#686e6a;font-weight:800}
.kpi-card strong{display:block;font:500 30px/1 Georgia,serif;margin:10px 0 7px}
.kpi-card small{font-size:16px;color:var(--muted)}
.kpi-card.alert strong{color:var(--red)}

.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.65fr);gap:14px;align-items:start}
.dashboard-main,.dashboard-aside{display:grid;gap:14px}
.panel{background:#fff;border:1px solid var(--line);padding:16px;box-shadow:0 3px 14px rgba(35,40,36,.03)}
.compact-panel{padding:14px}
.panel-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding-bottom:11px;margin-bottom:10px;border-bottom:1px solid #ebeae5}
.panel-heading h3{margin-bottom:2px}.panel-heading p{font-size:16px}
.source-pill{border:1px solid #d5c097;color:#8a622c;background:#fff8e9;font-size:16px;font-weight:800;letter-spacing:.08em;padding:4px 7px;white-space:nowrap}
.source-panel{border-left:3px solid var(--gold)}.source-panel h3{font-size:16px;margin-top:7px}.source-panel p{font-size:16px}

.card-list,.candidate-list,.decision-grid{display:grid;gap:8px}
.item-card,.candidate-card{border:1px solid #e3e1db;background:#fff;display:flex;justify-content:space-between;gap:13px;align-items:center;padding:11px 12px}
.item-card:hover,.candidate-card:hover{border-color:#cfc8ba;background:#fffdfa}
.item-card h4,.candidate-card h4{font-family:Georgia,serif}.item-card p,.candidate-card p{font-size:16px}
.item-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.mini-tag{font-size:16px;font-weight:800;padding:3px 6px;border:1px solid var(--line);background:#f6f5f1;color:#626762}
.mini-tag.warn{background:var(--amber-soft);border-color:#eed4a5;color:#875819}
.mini-tag.ok{background:var(--green-soft);border-color:#b9d8c7;color:var(--green)}
.empty-state{border:1px dashed #cbc8bf;background:#faf9f5;color:var(--muted);padding:17px;text-align:center;font-size:16px}

.priority-products{display:grid}
.product-row{display:grid;grid-template-columns:38px minmax(0,1fr) 128px 84px;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #eceae4}
.product-row:last-child{border-bottom:0}
.product-index{width:28px;height:28px;display:grid;place-items:center;border:1px solid #d8c49e;background:#fff9ec;color:#85602b;font:600 16px Georgia,serif}
.product-name strong,.product-name small{display:block}.product-name strong{font-size:16px}.product-name small{font-size:16px;color:var(--muted)}
.source-id{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;color:#535955}
.source-type{font-size:16px;font-weight:800;color:#7d6848;text-align:right}

.status-dot{width:10px;height:10px;border-radius:50%;background:#a3a7a4;box-shadow:0 0 0 4px #eeefed}
.status-dot.ok{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.status-dot.warn{background:#c47c1d;box-shadow:0 0 0 4px var(--amber-soft)}
.health-list,.queue-list{display:grid}
.health-item,.queue-item{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid #eceae5}
.health-item:last-child,.queue-item:last-child{border-bottom:0}
.health-item i,.queue-item i{width:8px;height:8px;border-radius:50%;background:#a6aaa7;margin-top:6px}
.health-item i.ok{background:var(--green)}.health-item i.warn{background:#c17c20}
.health-item strong,.health-item small,.queue-item strong,.queue-item small{display:block}
.health-item strong,.queue-item strong{font-size:16px}.health-item small,.queue-item small{font-size:16px;color:var(--muted)}
.health-item b,.queue-item b{font-size:16px;color:#696e6a}

.decision-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);padding:16px}
.decision-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.decision-head p{font-size:16px}.decision-head h3{font-size:18px}
.badge{display:inline-flex;align-items:center;min-height:27px;padding:4px 8px;border-radius:999px;background:#efefeb;color:#646965;font-size:16px;font-weight:850;white-space:nowrap}
.badge.warn{background:var(--amber-soft);color:#8b5a16}.badge.ok{background:var(--green-soft);color:var(--green)}
.decision-facts,.case-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0}
.fact{border:1px solid #e5e3dd;background:#faf9f6;padding:9px 10px}
.fact span{display:block;font-size:8px;letter-spacing:.1em;color:#777c78;font-weight:850;text-transform:uppercase;margin-bottom:3px}
.fact strong{font-size:16px;line-height:1.4}
.priority-select{min-height:38px;border:1px solid var(--line-dark);background:#fff;padding:7px 9px;border-radius:5px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
.decision-detail-top,.case-detail-top{margin-bottom:12px;border-top:3px solid var(--gold);scroll-margin-top:96px}
.case-detail-top:not(.hidden){min-height:calc(100vh - 190px)}
.tab{border:1px solid var(--line);background:#fff;color:#676c68;padding:7px 10px;font-size:16px;font-weight:750;white-space:nowrap}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.candidate-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}.candidate-meta span{font-size:16px;padding:2px 6px;background:var(--gold-soft);color:#795725}
.candidate-line{font-size:16px;color:#555a56;margin-top:3px}.candidate-line b{color:#303531}

.agent-worker-summary{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-left:4px solid var(--green)}
.worker-mark{width:42px;height:42px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-size:20px}
.worker-copy strong,.worker-copy small{display:block}.worker-copy small{color:var(--muted)}
.section-title-row{margin:19px 0 10px}.section-title-row h3{font-size:19px}
.flow-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flow-card{background:#fff;border:1px solid var(--line);padding:11px}
.flow-card-head{display:flex;justify-content:space-between;gap:8px}.flow-id{font:700 16px ui-monospace,monospace;color:#8b622b}.flow-card strong{display:block;font-size:16px;margin:6px 0 3px}.flow-card small{display:block;font-size:16px;color:var(--muted)}
.flow-state{font-size:8px;font-weight:850;color:var(--green);background:var(--green-soft);padding:3px 5px;height:max-content}
.agent-table{padding:0;overflow:auto}
.agent-row{display:grid;grid-template-columns:1.1fr 1.5fr 1.4fr 90px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #e9e7e1;min-width:760px}
.agent-row.header{background:#f5f4ef;color:#666b67;font-size:16px;font-weight:850;letter-spacing:.08em}
.agent-row:last-child{border-bottom:0}.agent-row strong{font-size:16px}.agent-row small{font-size:16px;color:var(--muted)}
.model-code{font:650 16px ui-monospace,SFMono-Regular,Consolas,monospace;color:#3f4944}

.runtime-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.runtime-item{border:1px solid #e3e1db;background:#faf9f5;padding:10px}
.runtime-item span{display:block;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#767b77;font-weight:850}
.runtime-item strong{display:block;font-size:16px;margin-top:4px}
.system-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.governance-list,.run-list{display:grid}
.governance-row,.run-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #eceae5;font-size:16px}
.governance-row:last-child,.run-row:last-child{border-bottom:0}.governance-row span,.run-row span{color:var(--muted)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;background:#222724;color:#e9eee9;padding:13px;max-height:430px;overflow:auto;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #e7e5df;font-size:16px}th{background:#f4f3ef;color:#676c68;font-size:16px;text-transform:uppercase}

.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,19,17,.65);backdrop-filter:blur(2px)}
.modal-card{position:relative;width:min(760px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-top:4px solid var(--gold);box-shadow:0 25px 80px rgba(0,0,0,.26);padding:20px}
.modal-header{display:flex;justify-content:space-between;gap:18px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.modal-header h2{font-size:28px}.modal-header p{font-size:16px}
.modal-close{width:34px;height:34px;border:1px solid var(--line);background:#fff;font-size:22px;color:#676c68}
.modal-progress{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center;margin:13px 0 16px}
.modal-progress span{font-size:16px;font-weight:850;color:#8a622c}.modal-progress div{height:3px;background:#ebe7df}.modal-progress i{display:block;width:50%;height:100%;background:var(--gold);transition:width .2s}
.form-grid,.request-step{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span-2{grid-column:1/-1}
.form-grid label,.request-step label{display:grid;gap:5px;font-size:16px;font-weight:750;color:#454a46}
.form-grid input,.form-grid select,.form-grid textarea,.request-step input,.request-step select,.request-step textarea{width:100%;border:1px solid #cfcdbf;background:#fff;color:var(--text);padding:9px 10px;min-height:39px;outline:none;border-radius:3px}
.form-grid textarea,.request-step textarea{resize:vertical}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus,.request-step input:focus,.request-step select:focus,.request-step textarea:focus{border-color:#a97933;box-shadow:0 0 0 2px rgba(201,151,69,.14)}
.mobile-nav,.mobile-create{display:none}

@media(max-width:1050px){
  .app-shell{grid-template-columns:210px minmax(0,1fr)}
  .dashboard-grid{grid-template-columns:1fr}.dashboard-aside{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}.source-panel{border-left:1px solid var(--line);border-top:3px solid var(--gold)}
  .flow-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  body{font-size:16px}
  .app-shell{display:block}.sidebar{display:none}.workspace{min-height:100vh}
  .topbar{min-height:66px;padding:10px 13px}.topbar h1{font-size:20px}.top-kicker{font-size:8px}
  .header-actions .button,.header-actions .chip:first-child,.icon-button{display:none}
  .content{padding:14px 12px 95px}.runtime-banner{grid-template-columns:30px 1fr}.runtime-banner .link-button{display:none}
  .page-heading{align-items:flex-start}.page-heading h2{font-size:29px}.desktop-only{display:none}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-card{min-height:92px;padding:12px}
  .dashboard-aside{grid-template-columns:1fr}.product-row{grid-template-columns:34px 1fr 95px}.source-type{display:none}
  .decision-facts,.case-stats,.runtime-grid,.system-grid{grid-template-columns:1fr}
  .flow-grid{grid-template-columns:1fr 1fr}
  .item-card,.candidate-card{align-items:flex-start}.item-card .button,.candidate-card .button{flex:0 0 auto}
  .mobile-nav{position:fixed;z-index:80;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,253,.98);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px rgba(30,35,31,.08)}
  .mobile-nav button{border:0;background:transparent;color:#737874;min-height:49px;display:grid;place-items:center;gap:0;font-size:17px}.mobile-nav button span{font-size:16px}.mobile-nav button.active{color:var(--green);background:#edf5f0}
  .mobile-create{position:fixed;z-index:85;right:14px;bottom:68px;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:24px;box-shadow:0 8px 24px rgba(23,107,74,.3)}
  .modal{padding:0;align-items:end}.modal-card{width:100%;max-height:94vh;padding:16px;border-top-width:3px}.modal-header h2{font-size:25px}
}
@media(max-width:560px){
  h2{font-size:27px}.content{padding-left:9px;padding-right:9px}.kpi-grid{gap:7px}.kpi-card strong{font-size:26px}
  .flow-grid{grid-template-columns:1fr}.form-grid,.request-step{grid-template-columns:1fr}.span-2{grid-column:auto}
  .product-row{grid-template-columns:31px 1fr 82px;gap:6px}.source-id{font-size:16px}
  .decision-head{display:grid}.decision-head .badge{width:max-content}.decision-facts{grid-template-columns:1fr}
  .agent-worker-summary{grid-template-columns:auto 1fr}.agent-worker-summary>.badge{grid-column:1/-1;width:max-content}
  .form-actions .button{flex:1}.panel{padding:13px}
}
@media(max-width:390px){
  .header-actions{gap:5px}.header-actions .button{padding:8px 7px;font-size:16px}.topbar{padding-left:11px;padding-right:11px}
}
@media(max-width:360px){
  .header-actions .icon-button{display:none}.header-actions .button{font-size:16px;padding:7px 5px}.content{padding-left:6px;padding-right:6px}
}
@import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap");\n*{font-family:"Be Vietnam Pro",sans-serif!important}\nhtml{font-size:16px}\n</style>
